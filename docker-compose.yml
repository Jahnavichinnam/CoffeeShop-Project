
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: coffeeshop-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      POSTGRES_DB: coffeeshopdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coffeeshop-net

  backend:
    image: jahnavichinnam/docker-backend-2400032091:latest
    container_name: coffeeshop-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/coffeeshopdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-docker}
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - coffeeshop-net

  frontend:
    image: jahnavichinnam/docker-frontend-2400032091:latest
    container_name: coffeeshop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - coffeeshop-net

volumes:
  postgres_data:

networks:
  coffeeshop-net:
